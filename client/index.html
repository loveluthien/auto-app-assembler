<!DOCTYPE html>
<html>
<head>
  <title>Mix 'N Match: Automatic App Assembler</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<link rel="stylesheet" href="style.css">


</head>
<body>





<div style="display: flex; flex-direction: column; gap: 30px; margin-bottom: 40px; width: 860px; margin-left: auto; margin-right: auto;">
    <header style="display: flex; align-items: center;" >
    <div class="imgbox">
        <img class="center-fit" src="carta_logo.png" alt="CARTA Logo" style="height: 100px;">
    </div>
    <h1 id="header_title" style="margin-left: 10px;">CARTA Mix 'N Match: <br>Auto App Assembler </h1>
    <button id="theme-switcher" style="margin-left:auto; margin-right:20px; padding:8px 16px;">Switch Theme</button>
    <div id="buildOverlay">
        <div id="overlayText">Assembling your App.<br>Please wait.</div>
    </div>
    <div id="busyOverlay">
        <div id="overlayText">The system is busy with another job.<br>Please wait.</div>
   </div>
</header>
    <div class="section">
        <h2 class="section-header">
            carta-frontend branch
        </h2>
        <select id="frontend-branch" style="width: 100%; font-size: 1.1rem; padding: 6px 8px;"></select>
    </div>
    <div class="section">
        <h2 class="section-header">
            carta-backend branch
        </h2>
        <select id="backend-branch" style="width: 100%; font-size: 1.1rem; padding: 6px 8px;"></select>
    </div>
    <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px;">
        <button id="generate-button-linux-arm64" style="min-width:200px; font-size:1.15rem; padding:12px 20px;">Assemble Linux arm64</button>
        <button id="generate-button-linux-x64" style="min-width:200px; font-size:1.15rem; padding:12px 20px;">Assemble Linux x64</button>
        <button id="generate-button-macos-arm64" style="min-width:200px; font-size:1.15rem; padding:12px 20px;">Assemble macOS arm64</button>
        <button id="generate-button-macos-x64" style="min-width:200px; font-size:1.15rem; padding:12px 20px;">Assemble macOS x64</button>
    </div>
    <div class="vertical-menu" style="margin-top: 0;">
        <h2>Download list</h2>
        <ul id="file-list"></ul>
    </div>
</div>

<script src="client.js"></script>
</body>
<script>
// Theme switcher logic
const themeSwitcher = document.getElementById('theme-switcher');
const root = document.documentElement;
function setTheme(theme, save = true) {
    if (theme === 'light') {
        document.body.classList.remove('dark-theme');
        document.body.classList.add('light-theme');
        if (save) localStorage.setItem('theme', 'light');
    } else {
        document.body.classList.remove('light-theme');
        document.body.classList.add('dark-theme');
        if (save) localStorage.setItem('theme', 'dark');
    }
}

// Listen for system appearance changes
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    setTheme('dark');
}

themeSwitcher.addEventListener('click', () => {
    if (document.body.classList.contains('dark-theme')) {
        setTheme('light');
    } else {
        setTheme('dark');
    }
});

// On load, use system appearance unless user has chosen a theme
const storedTheme = localStorage.getItem('theme');
if (storedTheme === 'light' || storedTheme === 'dark') {
    setTheme(storedTheme);
} else {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light', false);
}
</script>

</body>
</html>
